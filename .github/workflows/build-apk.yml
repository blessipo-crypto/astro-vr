name: Compiler APK Meta Quest (Autonome & WebXR)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deployer WebXR HTTPS (GitHub Pages)
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install and build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm run verify:security

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-standalone-apk:
    name: Compiler APK Autonome Hors-Ligne (Capacitor)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install and build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm run verify:security

      - name: Build Capacitor APK (Release Signé)
        run: |
          set -e
          npx cap add android
          npx cap sync android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            if (!fs.existsSync(p)) process.exit(0);
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("screenOrientation")) {
              xml = xml.replace(/<activity\b/, "<activity android:screenOrientation=\"sensorLandscape\"");
            }
            fs.writeFileSync(p, xml);
          ' "$MANIFEST"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..

          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT_DIR="$(ls -d "$SDK_PATH"/build-tools/* | sort -V | tail -n 1)"
          "$BT_DIR/zipalign" -v -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk app-autonome-aligned.apk
          "$BT_DIR/apksigner" sign \
            --ks "$PWD/scripts/uranie-sideload.p12" \
            --ks-type PKCS12 \
            --ks-key-alias uranie-vr \
            --ks-pass pass:uranievr123 \
            --key-pass pass:uranievr123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$PWD/uranie-vr-autonome.apk" \
            app-autonome-aligned.apk
          "$BT_DIR/apksigner" verify --verbose "$PWD/uranie-vr-autonome.apk"
          ls -lh uranie-vr-autonome.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v6
        with:
          name: uranie-vr-autonome-apk
          path: uranie-vr-autonome.apk

  build-quest-webxr-apk:
    name: Compiler APK WebXR VR/Passthrough (TWA Meta Quest)
    needs: deploy-pages
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Meta Quest TWA APK (sans CLI interactif)
        run: |
          set -e
          npm install --legacy-peer-deps
          npm run build

          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_PATH" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            echo "Installing Android SDK build-tools;36.1.0 & platforms;android-36..."
            (yes | "$SDKMANAGER" --sdk_root="$SDK_PATH" --licenses >/dev/null 2>&1) || (yes | sudo "$SDKMANAGER" --sdk_root="$SDK_PATH" --licenses >/dev/null 2>&1) || true
            (yes | "$SDKMANAGER" --sdk_root="$SDK_PATH" "platform-tools" "build-tools;36.1.0" "platforms;android-36") || (yes | sudo "$SDKMANAGER" --sdk_root="$SDK_PATH" "platform-tools" "build-tools;36.1.0" "platforms;android-36")
          fi

          mkdir -p /tmp/bwcore /tmp/twa-build
          npm install --prefix /tmp/bwcore @bubblewrap/core --no-save

          cp "$PWD/scripts/uranie-sideload.p12" ./android.keystore

          cp twa-manifest.json /tmp/twa-build/twa-manifest.json

          python3 -m http.server 8787 --bind 127.0.0.1 -d dist >/dev/null 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8787/manifest.webmanifest >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          if ! curl -sfI "https://blessipo-crypto.github.io/astro-vr/manifest.webmanifest" >/dev/null 2>&1; then
            echo "Using local HTTP server for TWA icons & manifest..."
            node -e 'const fs=require("fs"),p="/tmp/twa-build/twa-manifest.json",m=JSON.parse(fs.readFileSync(p,"utf8"));m.iconUrl="http://127.0.0.1:8787/pwa-512x512.png";m.maskableIconUrl="http://127.0.0.1:8787/pwa-maskable-512x512.png";m.webManifestUrl="http://127.0.0.1:8787/manifest.webmanifest";fs.writeFileSync(p,JSON.stringify(m,null,2));'
          fi

          echo "Generating TWA Android project via @bubblewrap/core (no prompts)..."
          node -e '
            const { TwaManifest, TwaGenerator, ConsoleLog } = require("/tmp/bwcore/node_modules/@bubblewrap/core");
            (async () => {
              const m = await TwaManifest.fromFile("/tmp/twa-build/twa-manifest.json");
              const err = m.validate();
              if (err) throw new Error(err);
              const gen = new TwaGenerator();
              await gen.createTwaProject("/tmp/twa-build", m, new ConsoleLog("twa"));
            })().catch((e) => { console.error(e); process.exit(1); });
          '

          echo "Compiling TWA APK with Gradle..."
          (
            cd /tmp/twa-build
            chmod +x gradlew
            ANDROID_HOME="$SDK_PATH" ANDROID_SDK_ROOT="$SDK_PATH" ./gradlew assembleRelease --no-daemon
          )

          BT_DIR="$(ls -d "$SDK_PATH"/build-tools/* | sort -V | tail -n 1)"
          "$BT_DIR/zipalign" -v -f -p 4 /tmp/twa-build/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/twa-build/app-release-aligned.apk
          "$BT_DIR/apksigner" sign \
            --ks "$PWD/scripts/uranie-sideload.p12" \
            --ks-type PKCS12 \
            --ks-key-alias uranie-vr \
            --ks-pass pass:uranievr123 \
            --key-pass pass:uranievr123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$PWD/uranie-vr-quest3-webxr.apk" \
            /tmp/twa-build/app-release-aligned.apk
          "$BT_DIR/apksigner" verify --verbose "$PWD/uranie-vr-quest3-webxr.apk"

          ls -lh uranie-vr-quest3-webxr.apk

      - name: Upload Quest WebXR APK
        uses: actions/upload-artifact@v6
        with:
          name: uranie-vr-quest3-webxr-apk
          path: uranie-vr-quest3-webxr.apk
          if-no-files-found: ignore

  build-windows-exe:
    name: Compiler Application PC Windows (.exe)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install and build web bundle
        shell: bash
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm run verify:security
          rm -rf electron/dist
          cp -r dist electron/dist

      - name: Build Windows .exe (Portable + Setup)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          cd electron
          npm install
          npx electron-builder --win --x64 --publish never

      - name: Upload Windows .exe
        uses: actions/upload-artifact@v6
        with:
          name: uranie-vr-windows-exe
          path: |
            electron/release/Uranie-VR-Portable.exe
            electron/release/Uranie-VR-Setup.exe
          if-no-files-found: ignore

  publish-release:
    name: Publier Téléchargements Directs (GitHub Releases)
    needs: [build-standalone-apk, build-quest-webxr-apk, build-windows-exe]
    if: always()
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Scan Antivirus (ClamAV) & Génération SHA256SUMS.txt
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav
          sudo freshclam || true
          echo "=== Uranie VR — Rapport de Scan Antivirus (ClamAV) ===" > ./release-assets/ANTIVIRUS-SCAN-REPORT.txt
          date -u +"Date UTC : %Y-%m-%dT%H:%M:%SZ" >> ./release-assets/ANTIVIRUS-SCAN-REPORT.txt
          clamscan --version >> ./release-assets/ANTIVIRUS-SCAN-REPORT.txt || true
          echo "" >> ./release-assets/ANTIVIRUS-SCAN-REPORT.txt
          clamscan -r --infected ./release-assets/*.exe ./release-assets/*.apk >> ./release-assets/ANTIVIRUS-SCAN-REPORT.txt 2>&1 || {
            STATUS=$?
            cat ./release-assets/ANTIVIRUS-SCAN-REPORT.txt
            exit $STATUS
          }
          (cd ./release-assets && sha256sum *.exe *.apk > SHA256SUMS.txt)
          cat ./release-assets/SHA256SUMS.txt
          cat ./release-assets/ANTIVIRUS-SCAN-REPORT.txt

      - name: Create or update GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Uranie VR — Téléchargements PC & Meta Quest
          make_latest: true
          body: |
            Téléchargements directs générés automatiquement (vérifiés par audit statique, scan ClamAV et empreintes SHA-256) :
            - **PC Windows (Portable, sans installation)** : `Uranie-VR-Portable.exe`
            - **PC Windows (Installateur avec raccourcis)** : `Uranie-VR-Setup.exe`
            - **Meta Quest WebXR (VR + Passthrough via GitHub Pages)** : `uranie-vr-quest3-webxr.apk`
            - **Meta Quest Autonome Hors-Ligne** : `uranie-vr-autonome.apk`
            - **Vérification d’intégrité & Antivirus** : `SHA256SUMS.txt` et `ANTIVIRUS-SCAN-REPORT.txt`

            Version WebXR en ligne : https://blessipo-crypto.github.io/astro-vr/
          files: |
            ./release-assets/*.exe
            ./release-assets/*.apk
            ./release-assets/SHA256SUMS.txt
            ./release-assets/ANTIVIRUS-SCAN-REPORT.txt
