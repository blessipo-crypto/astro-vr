name: Compiler APK Meta Quest (Autonome & WebXR)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    name: Deployer WebXR HTTPS (GitHub Pages)
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install and build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-standalone-apk:
    name: Compiler APK Autonome Hors-Ligne (Capacitor)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install and build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Build Capacitor APK
        run: |
          npx cap add android
          npx cap sync android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "screenOrientation" "$MANIFEST"; then
            sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' "$MANIFEST"
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk uranie-vr-autonome.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v6
        with:
          name: uranie-vr-autonome-apk
          path: uranie-vr-autonome.apk

  build-quest-webxr-apk:
    name: Compiler APK WebXR VR/Passthrough (Bubblewrap TWA)
    needs: deploy-pages
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Meta Quest TWA APK
        env:
          CI: 'true'
          BUBBLEWRAP_KEYSTORE_PASSWORD: uranievr123
          BUBBLEWRAP_KEY_PASSWORD: uranievr123
        run: |
          set -e
          npm install --legacy-peer-deps
          npm run build
          npm install -g @bubblewrap/cli

          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=""
          if [ -x "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_PATH/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/tools/bin/sdkmanager"
          elif [ -x "$SDK_PATH/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/bin/sdkmanager"
          fi

          if [ ! -d "$SDK_PATH/tools" ] && [ ! -d "$SDK_PATH/bin" ] && [ -d "$SDK_PATH/cmdline-tools/latest/bin" ]; then
            ln -sfn "$SDK_PATH/cmdline-tools/latest/bin" "$SDK_PATH/bin"
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Accepting Android SDK licenses and installing build-tools;36.1.0..."
            yes | "$SDKMANAGER" --sdk_root="$SDK_PATH" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_PATH" "build-tools;36.1.0" "platforms;android-36"
          fi

          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK_PATH" > "$HOME/.bubblewrap/config.json"

          if [ ! -f "./android.keystore" ]; then
            keytool -genkeypair -v -keystore ./android.keystore -alias uranie-vr -keyalg RSA -keysize 2048 -validity 10000 -storepass uranievr123 -keypass uranievr123 -dname "CN=Uranie VR, OU=Observatoire, O=Uranie, L=Paris, S=IDF, C=FR"
          fi

          python3 -m http.server 8787 -d dist >/dev/null 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          sleep 2

          if ! curl -sfI "https://blessipo-crypto.github.io/astro-vr/manifest.webmanifest" >/dev/null 2>&1; then
            echo "GitHub Pages not yet reachable, using local HTTP fallback for icons and webManifest..."
            node -e 'const fs=require("fs"),m=JSON.parse(fs.readFileSync("twa-manifest.json","utf8"));m.iconUrl="http://127.0.0.1:8787/pwa-512x512.png";m.maskableIconUrl="http://127.0.0.1:8787/pwa-maskable-512x512.png";m.webManifestUrl="http://127.0.0.1:8787/manifest.webmanifest";fs.writeFileSync("twa-manifest.json",JSON.stringify(m,null,2));'
          fi

          bubblewrap update --manifest="./twa-manifest.json" --skipVersionUpgrade < /dev/null
          bubblewrap build --skipVersionUpgrade < /dev/null
          if [ -f "app-release-signed.apk" ]; then
            cp app-release-signed.apk uranie-vr-quest3-webxr.apk
          fi

      - name: Upload Quest WebXR APK
        uses: actions/upload-artifact@v6
        with:
          name: uranie-vr-quest3-webxr-apk
          path: uranie-vr-quest3-webxr.apk
          if-no-files-found: ignore
